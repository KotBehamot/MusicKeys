name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
      notes:
        description: 'Additional release notes (optional)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release-prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate changelog entry
        id: changelog
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"
          DATE="$(date -u +%Y-%m-%d)"
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"

          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          echo "Previous tag: $PREV_TAG"
          echo "Collecting commits for $RANGE"
          COMMITS="$(git log --pretty=format:'- %s (%h)' $RANGE)"
          if [ -z "$COMMITS" ]; then
            COMMITS="- No changes recorded."
          fi

          NOTES_HDR="## $TAG - $DATE"
          NOTES="$NOTES_HDR

$COMMITS"

          if [ -n "${{ inputs.notes }}" ]; then
            NOTES="$NOTES

${{ inputs.notes }}"
          fi

          printf "%s\n" "$NOTES" > CHANGELOG-LATEST.md

          if [ -f CHANGELOG.md ]; then
            printf "%s\n\n" "$NOTES" | cat - CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          else
            printf "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n" > CHANGELOG.md
            printf "%s\n" "$NOTES" >> CHANGELOG.md
          fi

          echo "notes_path=CHANGELOG-LATEST.md" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit CHANGELOG
        run: |
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(release): update changelog for ${{ steps.changelog.outputs.tag }}"
            git push
          fi

      - name: Create tag
        run: |
          git tag -a "${{ steps.changelog.outputs.tag }}" -m "Release ${{ steps.changelog.outputs.tag }}"
          git push origin "${{ steps.changelog.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            ref="${GITHUB_REF#refs/tags/}"
            echo "version=${ref#v}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            echo "version=${tag#v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack MusicKeys
        run: |
          dotnet pack MusicKeys/MusicKeys.csproj -c Release -o out \
            /p:ContinuousIntegrationBuild=true \
            /p:PackageVersion=${{ steps.meta.outputs.version }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push out/*.nupkg \
            -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate
